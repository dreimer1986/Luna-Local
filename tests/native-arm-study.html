<!doctype html><meta charset="utf-8"><title>Luna: Native Arm-Rigs</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#28374b;color:white;font:16px system-ui}main{display:flex;gap:16px}canvas{width:440px;height:700px;background:#34465e}label{display:block;margin:10px}input{width:260px}main{flex-wrap:wrap}canvas{max-width:95vw}pre{white-space:pre-wrap}</style><h1>Native Gelenke – ohne Runtime-Verformung</h1><p>Links: Niziiro Mao © Live2D Inc. · Rechts: Luna V9 mit übertragenem Rig</p><main><canvas id="mao" width="660" height="1050"></canvas><canvas id="luna" width="660" height="1050"></canvas><section id="controls"></section></main><pre id="status"></pre><script type="module">
import {mountLuna} from '../tools/live2d/dist/runtime.mjs';
window.players=await Promise.all([mountLuna(document.querySelector('#mao'),'../tools/live2d/dist/Mao/Mao.model3.json'),mountLuna(document.querySelector('#luna'),'../tools/live2d/dist/LunaV9/luna.model3.json')]);
window.parameters={ParamEyeLOpen:1,ParamEyeROpen:1};
window.render=()=>{players.forEach(player=>player.draw(0,{nativeRig:true,reducedMotion:true,partOpacities:{PartArmLA:0,PartArmLB:1},parameters}));document.querySelectorAll('input[data-id]').forEach(i=>{i.value=parameters[i.dataset.id];i.parentElement.querySelector('output').value=i.value;});};
for(const id of ['ParamArmLB01','ParamArmLB02','ParamArmLB03','ParamHandLB']){const range=players[1].parameterRanges.find(p=>p.id===id),l=document.createElement('label'),v=document.createElement('output'),input=document.createElement('input');input.dataset.id=id;input.type='range';input.min=range.min;input.max=range.max;input.step=.1;input.value=range.default;parameters[id]=range.default;l.append(id+' ',v,document.createElement('br'),input);input.oninput=()=>{parameters[id]=Number(input.value);v.value=input.value;render()};document.querySelector('#controls').append(l);}
requestAnimationFrame(()=>{render();window.ready=true;});document.querySelector('#status').textContent=JSON.stringify(players.map(p=>p.parameterRanges.filter(r=>/ArmL|HandL|Switch|Pose/.test(r.id))),null,2);
</script>
