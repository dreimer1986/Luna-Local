<!doctype html><html lang="de"><meta charset="utf-8"><title>Luna Raumwiedergabe-Test</title>
<style>.rig{position:relative;width:420px;height:630px}</style><div class="rig"></div>
<script type="module">
import {RoomPlayback} from '../custom_components/luna_local/frontend/room-playback.mjs';
import {LunaLive2DRig} from '../custom_components/luna_local/frontend/live2d-rig.mjs';
window.audibleContexts=0;window.AudioContext=class {constructor(){audibleContexts++;throw Error('Passive avatar must stay silent')}};
window.receive=null;
const hass={connection:{subscribeMessage:async cb=>{window.receive=cb;return ()=>{};}}};
const session={phase:'idle',generation:0};session.roomPlayback=new RoomPlayback(hass);
const rig=new LunaLive2DRig(document.querySelector('.rig'),session,{live2d_runtime:'../tools/live2d/dist/runtime.mjs',live2d_model:'../tools/live2d/dist/LunaV9/luna.model3.json'});
await rig.ready;if(!rig.player)throw Error('Luna failed to load');
window.moods=[];window.mouth=[];const draw=rig.player.draw.bind(rig.player);rig.player.draw=(dt,p)=>{mouth.push(p.parameters.ParamMouthOpenY);moods.push(p.expression);return draw(dt,p)};
window.start=()=>receive({id:'room-test',device_id:'room',room:'Wohnzimmer',url:'/api/tts_proxy/room.wav',phase:'speaking',emotion_markers:['😢'],server_time:Date.now()/1000,started_at:Date.now()/1000});
window.stop=()=>receive({id:'room-test',device_id:'room',phase:'idle'});
window.ready=true;
</script></html>
