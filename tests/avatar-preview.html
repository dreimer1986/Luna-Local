<!doctype html><html lang="de"><meta charset="utf-8"><title>Luna Vorschau</title>
<style>body{margin:30px;background:#e6e9f2;font-family:system-ui}main{max-width:440px;margin:auto}h1{font-size:20px}ha-card{display:block;border-radius:18px;box-shadow:0 8px 30px #20264220}</style>
<main><h1>Luna · lokaler Animationstest</h1><luna-avatar-card></luna-avatar-card><p>Offline-Vorschau ohne Mikrofon oder HA-Verbindung.</p></main>
<script type="module">
import '../custom_components/luna_local/frontend/luna-avatar-card.js';
const card = document.querySelector('luna-avatar-card');
card.setConfig({presentation:'card'});
card.hass = {states:{},connection:{},callWS:async()=>{throw Error('Offline-Vorschau')}};
await new Promise(resolve=>setTimeout(resolve,200));
const firstSession=card.session;
card.openPopup();
if(card.session!==firstSession || !card.dialog.open) throw Error('Popup lost session');
card.dialog.close();
await new Promise(resolve=>setTimeout(resolve,100));
card.session.addMessage('user','Schön, dich zu sehen, Luna!');
card.session.addMessage('luna','Ich freue mich auch!');
card.session.expression={name:'shy',intensity:.8};
card.session.emit();
document.body.dataset.test='passed';
</script></html>
