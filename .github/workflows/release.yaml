name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check tag matches integration version and read release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path('custom_components/luna_local/manifest.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match manifest.json version')
          changelog = Path('CHANGELOG.md').read_text()
          heading = f'## {version}\n'
          if heading not in changelog:
              raise SystemExit('Add a changelog section for this version first')
          notes = changelog.split(heading, 1)[1].split('\n## ', 1)[0].strip()
          Path('release-notes.md').write_text(notes + '\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          name: Luna Local ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'b') || contains(github.ref_name, 'a') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
